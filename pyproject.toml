[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cmb"
dynamic = ["version"]
description = "Cere-MEG-Bellum (CMB) - Cerebellum segmentation and MNE-Python compatible source spaces for MEG/EEG"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    {name = "John Gustaf Wilhelm Samuelsson", email = "johnsam@mit.edu"},
    {name = "Christoph Dinh", email = "christoph.dinh@brain-link.de"},
    {name = "Teemu Taivainen", email = "ttaiv@outlook.com"}
]
keywords = ["neuroscience", "neuroimaging", "MEG", "EEG", "cerebellum", "brain"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Operating System :: MacOS",
]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "mne>=1.8",
    "matplotlib>=3.9",
    "nibabel>=5.3",
    "pandas>=2.2",
    "pooch>=1.8",
    "antspyx>=0.5",
    "torch>=2.0",
    "nnunet>=1.7",
]

[project.optional-dependencies]
viz = ["pyvista>=0.43"]
viz-qt = ["cmb[viz]", "pyvistaqt>=0.11", "PySide6"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock",
    "ruff",
    "pyright",
    "sphinx",
    "pydata-sphinx-theme",
    "myst-parser",
    "numpydoc",
    "sphinx-gallery",
]

[project.urls]
Documentation = "https://ceremegbellum.readthedocs.io"
Homepage = "https://github.com/johnsam7/ceremegbellum"
Source = "https://github.com/johnsam7/ceremegbellum/"
Tracker = "https://github.com/johnsam7/ceremegbellum/issues/"

[tool.setuptools.dynamic]
version = {attr = "cmb._version.__version__"}

[tool.setuptools.packages.find]
# package lives in cmb/ directory, also include any possible submodules
include = ["cmb", "cmb.*"]

# Ruff config
[tool.ruff]
extend-exclude = [
  "dev_tools",
]
[tool.ruff.lint]
select = ["A", "B006", "D", "E", "F", "I", "UP", "UP031", "W"]
ignore = [
  "D100",  # Missing docstring in public module
  "D104",  # Missing docstring in public package
  "D413",  # Missing blank line after last section
]
[tool.ruff.lint.per-file-ignores]
# sphinx-gallery examples start with an rST title block, not a docstring summary line.
"examples/*" = ["D205", "D400"]
[tool.ruff.lint.pydocstyle]
convention = "numpy"
ignore-decorators = [
  "property",
  "setter",
]

[tool.pyright]
typeCheckingMode = "standard"
exclude = [
  "dev_tools",
  "build",
]

[tool.pytest]
markers = [
    "requires_data: marks tests that require external data (deselect with '-m \"not requires_data\"')",
]
