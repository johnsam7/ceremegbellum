version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    pre_install:
      # CPU-only PyTorch: the default CUDA wheels are huge and not needed to build docs.
      - pip install torch --index-url https://download.pytorch.org/whl/cpu

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - dev

sphinx:
  configuration: docs/source/conf.py
  fail_on_warning: true
